<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subnet Evaluator</title>
<style>
  :root {
    --navy: #060a17;
    --navy-panel: #0c1224;
    --gold: #b49a45;
    --gold-light: #f2d56b;
    --green: #4ade80;
    --red: #c74444;
    --blue: #5aa9e0;
    --muted: #737d9f;
    --text: #e8ebf5;
    --border: rgba(255, 255, 255, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(circle at 20% 0%, rgba(212,175,55,0.06), transparent 40%), var(--navy);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  h1 {
    color: var(--gold);
    font-size: 1.8rem;
    letter-spacing: 1px;
    text-shadow: 0 0 16px rgba(212,175,55,0.35);
  }

  header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: 0.85rem;
  }

  .panel {
    background: linear-gradient(145deg, rgba(16,26,51,0.85), rgba(9,16,32,0.9));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .field {
    flex: 1;
    min-width: 160px;
  }

  label {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }

  input, select {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.9rem;
  }

  input:focus, select:focus {
    outline: none;
    border-color: rgba(212,175,55,0.4);
  }

  button {
    background: var(--gold);
    color: #10131f;
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 16px;
    transition: 0.2s;
  }

  button:hover { background: var(--gold-light); }

  .error {
    color: var(--red);
    font-size: 0.8rem;
    margin-top: 10px;
    display: none;
  }

  .results {
    display: none;
  }

  .results.show { display: block; }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 6px;
  }

  .result-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .result-label {
    font-size: 0.62rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 4px;
  }

  .result-value {
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold-light);
    font-family: Consolas, monospace;
  }

  .binary-row {
    margin-top: 14px;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    font-family: Consolas, monospace;
    font-size: 0.78rem;
    color: var(--blue);
    word-break: break-all;
    line-height: 1.6;
  }

  .host-range {
    color: var(--green);
  }

  .section-title {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 18px 0 8px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.7rem;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>SUBNET EVALUATOR</h1>
    <p>IPv4 subnet calculator — network, broadcast, host range, and mask details</p>
  </header>

  <div class="panel">
    <div class="input-row">
      <div class="field">
        <label>IP Address</label>
        <input type="text" id="ipInput" placeholder="e.g. 192.168.1.10" value="192.168.1.10">
      </div>
      <div class="field">
        <label>CIDR Prefix</label>
        <select id="cidrInput">
          <!-- populated by JS -->
        </select>
      </div>
    </div>
    <button onclick="evaluate()">Evaluate Subnet</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="panel results" id="resultsPanel">
    <div class="section-title">Subnet Details</div>
    <div class="result-grid" id="resultGrid"></div>

    <div class="section-title">Host Range</div>
    <div class="result-item">
      <div class="result-label">Usable Host Addresses</div>
      <div class="result-value host-range" id="hostRange"></div>
    </div>

    <div class="section-title">Binary Representation</div>
    <div class="binary-row" id="binaryRow"></div>
  </div>

  <footer>Built for networking practice — IPv4 only</footer>
</div>

<script>
  const cidrSelect = document.getElementById('cidrInput');
  for (let i = 0; i <= 32; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `/${i}`;
    if (i === 24) opt.selected = true;
    cidrSelect.appendChild(opt);
  }

  function ipToInt(ip) {
    const parts = ip.split('.').map(Number);
    if (parts.length !== 4 || parts.some(p => isNaN(p) || p < 0 || p > 255)) {
      return null;
    }
    return ((parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8) | parts[3]) >>> 0;
  }

  function intToIp(int) {
    return [
      (int >>> 24) & 255,
      (int >>> 16) & 255,
      (int >>> 8) & 255,
      int & 255
    ].join('.');
  }

  function intToBinary(int) {
    return (int >>> 0).toString(2).padStart(32, '0').match(/.{1,8}/g).join('.');
  }

  function evaluate() {
    const ipStr = document.getElementById('ipInput').value.trim();
    const cidr = parseInt(cidrSelect.value, 10);
    const errorEl = document.getElementById('errorMsg');
    const resultsPanel = document.getElementById('resultsPanel');

    const ipInt = ipToInt(ipStr);
    if (ipInt === null) {
      errorEl.textContent = 'Please enter a valid IPv4 address (e.g. 192.168.1.10)';
      errorEl.style.display = 'block';
      resultsPanel.classList.remove('show');
      return;
    }
    errorEl.style.display = 'none';

    const maskInt = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;
    const networkInt = (ipInt & maskInt) >>> 0;
    const broadcastInt = (networkInt | (~maskInt >>> 0)) >>> 0;
    const totalHosts = Math.pow(2, 32 - cidr);
    const usableHosts = cidr >= 31 ? 0 : totalHosts - 2;

    const firstHost = cidr >= 31 ? networkInt : networkInt + 1;
    const lastHost = cidr >= 31 ? broadcastInt : broadcastInt - 1;

    const wildcardInt = (~maskInt) >>> 0;

    const results = [
      { label: 'Network Address', value: intToIp(networkInt) },
      { label: 'Broadcast Address', value: intToIp(broadcastInt) },
      { label: 'Subnet Mask', value: intToIp(maskInt) },
      { label: 'Wildcard Mask', value: intToIp(wildcardInt) },
      { label: 'CIDR Notation', value: `/${cidr}` },
      { label: 'Total Addresses', value: totalHosts.toLocaleString() },
      { label: 'Usable Hosts', value: usableHosts.toLocaleString() },
      { label: 'IP Class (legacy)', value: getClass(ipInt) },
    ];

    const grid = document.getElementById('resultGrid');
    grid.innerHTML = results.map(r => `
      <div class="result-item">
        <div class="result-label">${r.label}</div>
        <div class="result-value">${r.value}</div>
      </div>
    `).join('');

    document.getElementById('hostRange').textContent =
      usableHosts > 0 ? `${intToIp(firstHost)} — ${intToIp(lastHost)}` : 'None (point-to-point or single host)';

    document.getElementById('binaryRow').innerHTML =
      `IP:      ${intToBinary(ipInt)}<br>` +
      `Mask:    ${intToBinary(maskInt)}<br>` +
      `Network: ${intToBinary(networkInt)}`;

    resultsPanel.classList.add('show');
  }

  function getClass(ipInt) {
    const firstOctet = (ipInt >>> 24) & 255;
    if (firstOctet < 128) return 'A';
    if (firstOctet < 192) return 'B';
    if (firstOctet < 224) return 'C';
    if (firstOctet < 240) return 'D (Multicast)';
    return 'E (Reserved)';
  }

  // Evaluate once on load with the default values
  evaluate();
</script>

</body>
</html>
